{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sithara – AI-powered music generation using Strategy Pattern">
  <title>{% block title %}Sithara{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <nav class="navbar">
    <a href="{% url 'home' %}" class="navbar-brand">
      <span class="logo-icon">🎵</span> Sithara
    </a>
    <div class="navbar-center">
      <a href="{% url 'generate' %}" id="nav-create"
        class="{% if active_page == 'generate' %}active{% endif %}">Create</a>
      <a href="{% url 'library' %}" id="nav-library"
        class="{% if active_page == 'library' %}active{% endif %}">Library</a>
      <a href="#" id="nav-pricing">Pricing</a>
    </div>
    <div class="navbar-right">
      <div class="user-avatar" title="John Doe">JD</div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <!-- Hidden Audio Element for better browser compatibility -->
  <audio id="app-audio" preload="auto" style="display:none;"></audio>

  <!-- Sticky Music Player -->
  <div class="player" id="music-player">
    <div class="player-info">
      <div class="player-icon">🎵</div>
      <div>
        <div class="player-title" id="player-title">Summer Vibes</div>
        <div class="player-genre" id="player-genre">Pop, Upbeat</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn" title="Previous">⏮</button>
      <button class="player-btn play-btn" id="player-play-btn" title="Play/Pause">▶</button>
      <button class="player-btn" title="Next">⏭</button>
    </div>
    <div class="player-progress">
      <span class="player-time" id="player-current">0:00</span>
      <div class="progress-bar-container" id="progress-bar">
        <div class="progress-bar-fill" id="progress-fill"></div>
        <div class="progress-bar-thumb" id="progress-thumb"></div>
      </div>
      <span class="player-time" id="player-duration">0:00</span>
    </div>
    <div class="player-volume">
      <span class="volume-icon">🔊</span>
      <input type="range" class="volume-slider" min="0" max="100" value="70">
    </div>
    <a href="#" class="player-download" id="player-download" target="_blank">Download</a>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function getCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? v.pop() : '';
    }

    // Global Player Setup
    window.appAudio = document.getElementById('app-audio');
    const playBtn = document.getElementById('player-play-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressThumb = document.getElementById('progress-thumb');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('player-current');
    const durationTimeEl = document.getElementById('player-duration');
    const volumeSlider = document.querySelector('.volume-slider');

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    playBtn.addEventListener('click', function () {
      if (!window.appAudio.src) return;

      // If it finished playing, reset to beginning before playing again
      if (window.appAudio.ended) {
        window.appAudio.currentTime = 0;
      }

      if (window.appAudio.paused || window.appAudio.ended) {
        window.appAudio.play().catch(e => {
          console.error('Play error:', e);
          showToast('Playback failed: ' + e.message, 'error');
        });
      } else {
        window.appAudio.pause();
      }
    });

    window.appAudio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
    window.appAudio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

    window.appAudio.addEventListener('timeupdate', () => {
      currentTimeEl.textContent = formatTime(window.appAudio.currentTime);
      const percent = (window.appAudio.currentTime / window.appAudio.duration) * 100 || 0;
      progressFill.style.width = `${percent}%`;
      progressThumb.style.left = `${percent}%`;
    });

    window.appAudio.addEventListener('loadedmetadata', () => {
      durationTimeEl.textContent = formatTime(window.appAudio.duration);
    });

    window.appAudio.addEventListener('error', (e) => {
      console.error('Audio error:', e);
      showToast('Failed to load audio stream', 'error');
    });

    progressBar.addEventListener('click', (e) => {
      if (!window.appAudio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      window.appAudio.currentTime = percent * window.appAudio.duration;
    });

    volumeSlider.addEventListener('input', (e) => {
      window.appAudio.volume = e.target.value / 100;
    });
    window.appAudio.volume = volumeSlider.value / 100;

    // Function to initialize a song from any page
    window.loadAndPlaySong = function(url, title, genre) {
      document.getElementById('player-title').textContent = title || 'Unknown Title';
      document.getElementById('player-genre').textContent = genre || 'AI Generated';
      const dlBtn = document.getElementById('player-download');
      
      // Workaround for strict browsers: if the URL doesn't have an extension, add .mp3
      let playUrl = url;
      if (playUrl && !playUrl.endsWith('.mp3') && playUrl.startsWith('http')) {
        playUrl += '.mp3';
      }
      
      if (dlBtn) { dlBtn.href = playUrl; dlBtn.download = ''; }
      
      // Reset times before load
      currentTimeEl.textContent = '0:00';
      durationTimeEl.textContent = '...';
      progressFill.style.width = '0%';
      progressThumb.style.left = '0%';
      
      window.appAudio.src = playUrl;
      window.appAudio.play().catch(e => {
        console.error('Play error:', e);
        if (e.name !== 'AbortError') {
          showToast('Song loaded! Press ▶ to listen', 'success');
          
          // Highlight the play button to draw attention
          const playBtn = document.getElementById('player-play-btn');
          playBtn.style.transform = 'scale(1.2)';
          playBtn.style.backgroundColor = 'var(--primary-dark)';
          setTimeout(() => {
            playBtn.style.transform = '';
            playBtn.style.backgroundColor = '';
          }, 1000);
        }
      });
    };
  </script>
  {% block scripts %}{% endblock %}
</body>

</html>
